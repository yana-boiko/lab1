config:
  datasource:
    host: postgres
    user: lab1
    database: labdb
    sslmode: disable
    passwordSecret:
      name: db-secret
      key: DB_PASSWORD

serviceMonitor:
  enabled: true
  interval: 5s

nodeSelector:
  role: infra
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
