# Стенд: база, вебінстанс і балансувальник.
# Запуск з одним вебінстансом:  docker compose up -d --build
# Запуск з двома вебінстансами: docker compose up -d --build --scale web=2

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
    networks: [backend]

  web:
    build: .
    image: lab1-web
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL_SIZE: "15"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "/srv/app/healthcheck.py"]   # без curl і wget
      interval: 3s
      timeout: 4s
      retries: 10
      start_period: 3s
    deploy:
      resources:
        limits:
          cpus: "1"                     # ліміти за варіантом
          memory: 768M
    networks: [backend]

  lb:
    image: nginx:1.27-alpine
    volumes:
      - ./lb/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8000:80"
    depends_on:
      web:
        condition: service_healthy
    networks: [backend]

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"
    networks: [backend]

volumes:
  pgdata:
  promdata:

networks:
  backend:
